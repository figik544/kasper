services:
- type: web
  name: kasper-bot
  env: python
  region: frankfurt
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: python web_app.py
  envVars:
  - key: DISCORD_BOT_TOKEN
    sync: false
  - key: SECRET_KEY
    sync: false
  healthCheckPath: /api/status
  healthCheckMaxRetries: 3