<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель управления - Галактический Имперский Бот</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%231a1a1a"/><circle cx="20" cy="30" r="1" fill="%23444444"/><circle cx="50" cy="10" r="0.5" fill="%23444444"/><circle cx="80" cy="40" r="0.7" fill="%23444444"/><circle cx="30" cy="70" r="0.6" fill="%23444444"/><circle cx="70" cy="80" r="0.8" fill="%23444444"/></svg>');
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            color: #ffd700;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #3a3a3a;
            color: #fff;
            box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 1.1em;
        }
        button:hover {
            background-color: #ffcc00;
        }
        .error {
            color: #ff6666;
            margin-top: 10px;
        }
        .logo {
            color: #ffd700;
            font-size: 2em;
            margin-bottom: 20px;
        }
        .back-link {
            margin-top: 20px;
            color: #aaa;
        }
        .back-link a {
            color: #ffd700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">👑</div>
        <h1>Вход в панель управления</h1>
        <p>Введите ID пользователя Верховного Правителя</p>
        
        <form method="post" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label for="user_id">ID пользователя:</label>
                <input type="text" id="user_id" name="user_id" placeholder="Введите ваш ID пользователя" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>
            </div>
            <button type="submit">Войти</button>
        </form>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="error">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <div class="back-link">
            <a href="/">← Вернуться на главную</a>
        </div>
    </div>
</body>
</html>
