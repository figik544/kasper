<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки - Галактический Имперский Бот</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%231a1a1a"/><circle cx="20" cy="30" r="1" fill="%23444444"/><circle cx="50" cy="10" r="0.5" fill="%23444444"/><circle cx="80" cy="40" r="0.7" fill="%23444444"/><circle cx="30" cy="70" r="0.6" fill="%23444444"/><circle cx="70" cy="80" r="0.8" fill="%23444444"/></svg>');
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #ffd700;
            margin-bottom: 30px;
        }
        h1 {
            color: #ffd700;
            margin: 0;
        }
        .nav-bar {
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .nav-bar a {
            color: #ffffff;
            text-decoration: none;
            padding: 10px 15px;
            margin-right: 10px;
            background-color: #3a3a3a;
            border-radius: 3px;
        }
        .nav-bar a:hover {
            background-color: #4a4a4a;
        }
        .section {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .section h2 {
            color: #ffd700;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #3a3a3a;
            color: #fff;
            box-sizing: border-box;
        }
        input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
        }
        button {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #ffcc00;
        }
        .logout-btn {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            float: right;
        }
        .logout-btn:hover {
            background-color: #cc3333;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ Настройки - Галактический Имперский Бот</h1>
            <p>Конфигурация системы Федерации Галактической Империи</p>
        </header>
        
        <div class="nav-bar">
            <a href="{{ url_for('dashboard') }}">Дашборд</a>
            <a href="{{ url_for('users') }}">Пользователи</a>
            <a href="{{ url_for('settings') }}">Настройки</a>
            <a href="{{ url_for('government') }}">Правительство</a>
            <a href="{{ url_for('advertising') }}">Реклама</a>
            <a href="{{ url_for('moderate') }}">Модерация</a>
            <form style="display: inline;" method="POST" action="{{ url_for('logout') }}">
                <button type="submit" class="logout-btn">Выйти</button>
            </form>
        </div>
        
        <div class="section">
            <h2>Основные настройки</h2>
            <form method="POST">
                <div class="form-group">
                    <label for="prefix">Префикс команд:</label>
                    <input type="text" id="prefix" name="prefix" value="{{ config.default_prefix }}" required>
                </div>
                
                <div class="form-group">
                    <label for="max_warns">Максимальное количество предупреждений перед баном:</label>
                    <input type="number" id="max_warns" name="max_warns" value="{{ config.max_warns_before_ban }}" min="1" required>
                </div>
                
                <h3>Настройки опыта</h3>
                <div class="form-group">
                    <label for="xp_min">Минимальный опыт за сообщение:</label>
                    <input type="number" id="xp_min" name="xp_min" value="{{ config.xp_rewards.message_range_min }}" min="1" required>
                </div>
                
                <div class="form-group">
                    <label for="xp_max">Максимальный опыт за сообщение:</label>
                    <input type="number" id="xp_max" name="xp_max" value="{{ config.xp_rewards.message_range_max }}" min="1" required>
                </div>
                
                <div class="form-group">
                    <label for="command_bonus">Бонус за выполнение команд:</label>
                    <input type="number" id="command_bonus" name="command_bonus" value="{{ config.xp_rewards.command_bonus }}" min="0" required>
                </div>
                
                <h3>Настройки ежедневной награды</h3>
                <div class="form-group">
                    <label for="daily_min">Минимальная ежедневная награда:</label>
                    <input type="number" id="daily_min" name="daily_min" value="{{ config.daily_rewards.min_credits }}" min="0" required>
                </div>
                
                <div class="form-group">
                    <label for="daily_max">Максимальная ежедневная награда:</label>
                    <input type="number" id="daily_max" name="daily_max" value="{{ config.daily_rewards.max_credits }}" min="0" required>
                </div>
                
                <h3>Настройки рекламы</h3>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="advertising_enabled" name="advertising_enabled" {% if config.advertising_enabled %}checked{% endif %}>
                    <label for="advertising_enabled">Включить рекламу</label>
                </div>
                
                <div class="form-group">
                    <label for="ad_message">Текст рекламного сообщения:</label>
                    <input type="text" id="ad_message" name="ad_message" value="{{ config.ad_message }}">
                </div>
                
                <div class="form-group">
                    <label for="ad_frequency">Частота рекламы (в часах):</label>
                    <input type="number" id="ad_frequency" name="ad_frequency" value="{{ config.ad_frequency_hours }}" min="1" required>
                </div>
                
                <button type="submit">Сохранить настройки</button>
            </form>
        </div>
    </div>
</body>
</html>
